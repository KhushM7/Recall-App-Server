<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password OTP</title>
</head>

<body style="font-family: 'Arial', sans-serif; background-color: #e3f2fd; margin: 0; padding: 0; color: #0d47a1;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #e3f2fd; margin: 0; padding: 0;">
        <tr>
            <td align="center" style="padding: 40px 0;">
                <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background-color: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); border: 2px solid #bbdefb;">
                    <tr>
                        <td align="center" style="background-color: #0d47a1; padding: 15px; border-radius: 10px 10px 0 0; text-align: center; color: #ffffff; font-size: 26px;">
                            Physics Revision App
                        </td>
                    </tr>
                    <tr>
                        <td style="padding: 20px; text-align: center;">
                            <p>Hello,</p>
                            <p>To reset your password, please use the following OTP:</p>
                            <table role="presentation" cellpadding="0" cellspacing="0" align="center" style="margin: 20px auto;">
                                <tr>
                                    <td style="font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #0d47a1; background-color: #e3f2fd; padding: 5px 10px; border-radius: 5px; text-align: center;">
                                        otp
                                    </td>
                                    <td style="padding-left: 10px;">
                                        <a href="#" id="copy-link" onclick="copyToClipboard()" style="text-decoration: none; font-size: 32px; color: #0d47a1;">&#x1F5D0;</a> <!-- PAGES icon -->
                                    </td>
                                </tr>
                            </table>
                            <p>If you did not request this, please ignore this email.</p>
                        </td>
                    </tr>
                    <tr>
                        <td align="center" style="text-align: center; font-size: 12px; color: #1e88e5; margin-top: 30px;">
                            <p style="margin: 5px 0;">Thank you for using Physics Revision App.</p>
                            <p style="margin: 5px 0;">&copy; 2024 Physics Revision App. All rights reserved.</p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>

    <script>
        function copyToClipboard() {
            const otpText = 'otp'; // Replace with dynamic OTP value if needed
            navigator.clipboard.writeText(otpText).then(() => {
                document.getElementById('copy-link').innerHTML = '&#x1F5F8;'; // LIGHT CHECK MARK
                document.getElementById('copy-link').style.color = 'green';
            }).catch(err => {
                console.error('Failed to copy: ', err);
            });
        }
    </script>
</body>

</html>
